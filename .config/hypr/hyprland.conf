# always refer to Hyprland wiki
# https://wiki.hyprland.org/

# Initial boot script enable to apply initial wallpapers, theming, new settings etc.
# suggest not to change this or delete this including deleting referrence file in ~/.config/hypr/.initial_startup_done
# as long as the referrence file is present, this initial-boot.sh will not execute
exec-once = $HOME/.config/hypr/initial-boot.sh

## This is where you want to start tinkering 
$config = $HOME/.config/hypr/configs # User Configs directory path

source= $config/Startup_Apps.conf # put your start-up packages on this file

source= $config/ENVariables.conf # Environment variables to load

#source= $config/Monitors.conf # Its all about your monitor config (old dots) will remove on push to main
#source= $config/WorkspaceRules.conf # Hyprland workspaces (old dots) will remove on push to main

source= $config/Laptops.conf # For laptop related

source= $config/LaptopDisplay.conf # Laptop display related. You need to read the comment on this file

source= $config/WindowRules.conf # all about Hyprland Window Rules and Layer Rules

source= $config/UserDecorations.conf # Decorations config file

source= $config/UserAnimations.conf # Animation config file

source= $config/UserKeybinds.conf # Put your own keybinds here

source= $config/UserSettings.conf # Main Hyprland Settings.

# nwg-displays
source= $HOME/.config/hypr/monitors.conf
source= $HOME/.config/hypr/workspaces.conf